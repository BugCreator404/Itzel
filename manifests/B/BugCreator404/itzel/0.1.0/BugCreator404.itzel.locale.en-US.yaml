ShortDescription: Local-first personal AI assistant. No telemetry. No cloud.
Description: |-
  Itzel is a local-first personal AI assistant that runs entirely on your machine.
  Powered by Itzel-1B (Qwen2.5 fine-tuned) or Ollama, it features voice input/output,
  a pixel-art axolotl mascot, an extensible skill system, and MCP server support.

  100% local. Zero telemetry. Zero data sent outside your machine.
  Bilingual: Spanish (Mexico) first, English as fallback.
