ReleaseNotes: |-
  Initial release of Itzel v0.1.0.
  - Local AI assistant with Itzel-1B or Ollama backend
  - Voice input (Whisper.cpp) and output (Kokoro-82M TTS)
  - Skill system with official skills: calculator, clipboard, web-search
  - MCP client for external tool servers
  - Encrypted SQLite database (SQLCipher AES-256)
  - Tauri 2 desktop app (Windows/macOS/Linux)
