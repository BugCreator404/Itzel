# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
# Manifiesto de instaladores WinGet para Itzel.
#
# Los InstallerUrl y InstallerSha256 se actualizan en cada release.
# CI genera estos valores automaticamente desde los artefactos de build.yml.
#
# Notas de arquitectura:
#   - El .msi lo genera Tauri (build.yml, WiX toolset).
#   - El instalador silencioso usa /quiet (WiX estandar).
#   - Scope: user (no requiere elevacion de administrador).
#   - No hay telemetria — ProductCode es solo para deteccion de updates en WinGet.

PackageIdentifier: BugCreator404.itzel
PackageVersion: 0.1.0
MinimumOSVersion: 10.0.19041.0
InstallerType: wix
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /quiet
  SilentWithProgress: /passive
  InstallLocation: /INSTALLDIR="{INSTALLDIR}"
InstallerSuccessCodes:
  - 0
  - 1638
UpgradeBehavior: install

Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/BugCreator404/itzel/releases/download/v0.1.0/itzel_0.1.0_x64_en-US.msi
    InstallerSha256: REPLACE_WITH_SHA256_OF_x64_MSI
    Scope: user
    ProductCode: "{REPLACE-WITH-PRODUCT-CODE-FROM-TAURI-BUILD}"

  - Architecture: arm64
    InstallerUrl: https://github.com/BugCreator404/itzel/releases/download/v0.1.0/itzel_0.1.0_arm64_en-US.msi
    InstallerSha256: REPLACE_WITH_SHA256_OF_ARM64_MSI
    Scope: user
    ProductCode: "{REPLACE-WITH-PRODUCT-CODE-FROM-TAURI-BUILD-ARM64}"

ManifestType: installer
ManifestVersion: 1.6.0
