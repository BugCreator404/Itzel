name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-frontend:
    name: Frontend — lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter desktop typecheck

      - name: Lint
        run: pnpm --filter desktop lint

      - name: Test
        run: pnpm --filter desktop test

  lint-and-test-python:
    name: Python — ruff + mypy + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core
        run: pip install -e "packages/core[dev]"

      - name: Install cli
        run: pip install -e "apps/cli[dev]"

      - name: Ruff lint
        run: ruff check packages/core apps/cli

      - name: Type check
        run: mypy packages/core/itzel_core apps/cli/itzel_cli --ignore-missing-imports

      - name: Tests
        run: pytest packages/core/tests/ apps/cli/tests/ -v

  build-desktop:
    name: Build Tauri (Ubuntu preview)
    runs-on: ubuntu-latest
    needs: [lint-and-test-frontend, lint-and-test-python]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri
        run: pnpm --filter desktop tauri build
        env:
          NODE_ENV: production
