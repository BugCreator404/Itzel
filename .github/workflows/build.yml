name: Build

# Compila la app de escritorio (Tauri) para los tres sistemas operativos y
# sube los instaladores como artifacts. Reutilizable desde release.yml vía
# workflow_call.
#
# Nota: el build de Tauri solo necesita Node + Rust (el frontend y el binario
# nativo). El backend de Python NO se empaqueta todavía (externalBin/resources
# vacíos en tauri.conf.json); cuando se empaquete, añadir aquí el setup de Python.

on:
  push:
    branches: [main]
  workflow_dispatch: {}     # permite lanzarlo manualmente desde la UI
  workflow_call: {}         # release.yml lo reutiliza

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # un OS que falle no cancela a los demás
      matrix:
        include:
          - os: windows-latest
            label: windows
            target: ""
          - os: macos-latest
            label: macos
            target: "--target universal-apple-darwin"
          - os: ubuntu-latest
            label: linux
            target: ""

    steps:
      - uses: actions/checkout@v4

      # ── Toolchains ──────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.label == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # ── Dependencias del sistema (solo Linux) ───────────────────────────
      - name: Install Linux system deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Build ───────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm --filter desktop tauri build ${{ matrix.target }}
        env:
          NODE_ENV: production
          # Firma del updater (opcional — si los secrets están vacíos, Tauri
          # genera artifacts sin firmar y el build NO falla).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Firma de código macOS (opcional — ver docs/SIGNING.md).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # ── Artifacts ───────────────────────────────────────────────────────
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: itzel-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
