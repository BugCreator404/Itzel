[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itzel-core"
version = "0.1.0"
description = "Motor principal de Itzel — FastAPI backend"
authors = [
  { name = "Edwin Yair Hernández Limón", email = "edwinyhl.dev@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.4",
  "sqlcipher3>=0.5.3",
  "keyring>=24.0.0",
  "python-jose[cryptography]>=3.3.0",
  "httpx>=0.27.0",
  "aiofiles>=24.1.0",
  # El router de voz (api/v1/voice.py) procesa audio PCM con numpy y el engine
  # siempre lo monta, así que numpy es dependencia de runtime del core.
  # The voice router handles PCM audio with numpy and is always mounted.
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["itzel_core*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# La longitud de línea la decide el formateador, no el linter (evita ruido en
# comentarios alineados y strings largos). Line length is owned by the formatter.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
