[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itzel-mcp"
version = "0.1.0"
description = "Cliente MCP de Itzel — conecta servidores Model Context Protocol y expone sus tools al engine"
authors = [
  { name = "Edwin Yair Hernández Limón", email = "edwinyhl.dev@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "itzel-core",          # Tool / ToolRegistry + keyring (transitivo)
  "mcp>=1.0.0",          # SDK oficial del Model Context Protocol
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
]

[project.urls]
Homepage   = "https://github.com/BugCreator404/itzel"
Repository = "https://github.com/BugCreator404/itzel"

# ─── setuptools ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where   = ["."]
include = ["itzel_mcp*"]

# ─── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
# Permite importar itzel_mcp (.) e itzel_core (../core) sin instalar en CI/dev.
pythonpath   = [".", "../core"]

# ─── ruff (linter) ────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
