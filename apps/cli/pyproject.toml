[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itzel-cli"
version = "0.1.0"
description = "Itzel CLI — IA personal local desde la terminal"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Edwin Yair Hernández Limón", email = "edwinyhl.dev@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.scripts]
itzel = "itzel_cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "mypy>=1.10.0",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["itzel_cli*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# La longitud de línea la decide el formateador, no el linter (evita ruido en
# comentarios alineados y strings largos). Line length is owned by the formatter.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
